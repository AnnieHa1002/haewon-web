name: Deploy site to GitHub Pages
on:
  push:
    branches: [main, claude/elegant-pasteur-pc4js3]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'   # 3시간마다 한빛 엔딩북 구글 문서 최신본 반영
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build.py
      - name: 한빛 엔딩북 (구글 문서 최신본)
        run: python3 tools/build_hanbit.py
        env:
          HANBIT_DOC_ID: ${{ vars.HANBIT_DOC_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
